name: build-and-upload-auth-lambda

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  PYTHON_VERSION: "3.12"

jobs:
  package-and-upload:
    # Temporary guard: keep workflow definition in repo but prevent execution.
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build lambda package
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/python dist
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t build/python
          cp -R src/* build/python/
          cd build/python
          zip -r ../../dist/auth-api.zip .

      - name: Upload artifacts to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.AUTH_LAMBDA_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_BUCKET}"
          SHA=${GITHUB_SHA}
          aws s3 cp dist/auth-api.zip s3://${ARTIFACT_BUCKET}/auth/${SHA}/auth-api.zip
          aws s3 cp dist/auth-api.zip s3://${ARTIFACT_BUCKET}/auth/${SHA}/authorizer.zip
